services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sabemi
      POSTGRES_USER: sabemi
      POSTGRES_PASSWORD: sabemi
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sabemi -d sabemi"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  # One-shot: applies the schema (DbUp) and exits. The API no longer migrates itself on
  # startup (see DatabaseMigrator), so this is what keeps `docker compose up` working
  # out of the box against a fresh Postgres volume.
  # ASPNETCORE_ENVIRONMENT=Development loads appsettings.Development.json inside the
  # container (versioned — see src/SabemiTec.Api/appsettings.Development.json), which is
  # where Webhook:ApiKey, Dashboard:ApiKey and Cors:DashboardOrigins now live for local
  # testing. Only ConnectionStrings__Default stays overridden here: the container reaches
  # Postgres via the `postgres` service name, while the committed
  # appsettings.Development.json points at `localhost` for when the API runs directly on
  # the host instead.
  migrate:
    build:
      context: .
      dockerfile: src/SabemiTec.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=sabemi;Username=sabemi;Password=sabemi"
    command: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: src/SabemiTec.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=sabemi;Username=sabemi;Password=sabemi"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: ./web
    environment:
      # This is the dashboard's key (Dashboard:ApiKey on the API), not the partner bank's
      # webhook key — nginx injects it server-side on every /api proxy request. Must match
      # appsettings.Development.json's Dashboard:ApiKey for the dashboard to authenticate.
      DASHBOARD_API_KEY: ${DASHBOARD_API_KEY:-dev-local-dashboard-key}
    ports:
      - "5173:80"
    depends_on:
      - api

  # Opt-in: STG_WEBHOOK_API_KEY=<chave real do sabemi-api> docker compose --profile simulator up -d --build
  # Off by default so a plain `docker compose up` stays quiet. Points at the staging API
  # deployed on Render (not the local `api` container) — no Render Background Worker to pay
  # for, you just run this on your own machine whenever you want the demo dashboard moving.
  # Override LOAD_SIMULATOR_API_URL to target the local `api` container instead.
  load-simulator:
    profiles: ["simulator"]
    build:
      context: .
      dockerfile: src/SabemiTec.LoadSimulator/Dockerfile
    environment:
      API_URL: ${LOAD_SIMULATOR_API_URL:-https://sabemi-api.onrender.com}
      # No hard-required (`:?`) default here on purpose: Compose validates every service's
      # interpolation up front regardless of active profile, so that would break a plain
      # `docker compose up` (no --profile simulator) too. Left empty, the container itself
      # (only started when the profile is active) fails fast with a clear message instead.
      WEBHOOK_API_KEY: ${STG_WEBHOOK_API_KEY:-}
      # Optional: GET /api/payments/contracts is a dashboard route now (Dashboard:ApiKey,
      # not Webhook:ApiKey — see ApiKeyAuthMiddleware). Without it, FetchContractsAsync just
      # falls back to its fixed contract list, so the simulator still works either way.
      DASHBOARD_API_KEY: ${STG_DASHBOARD_API_KEY:-}
      INTERVAL_SECONDS: ${LOAD_SIMULATOR_INTERVAL_SECONDS:-25}
      CONCURRENT_REQUESTS: ${LOAD_SIMULATOR_CONCURRENCY:-5}

volumes:
  pgdata:
