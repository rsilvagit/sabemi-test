name: Deploy Web

# Manual only: builds and pushes a fresh :latest web image, then tells Render to
# redeploy it. Independent from the API pipeline — running this never touches the
# API image or the API Render service.
on:
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR requires lowercase image paths; the repo owner/name can contain uppercase.
      - name: Compute lowercase image name
        id: image-name
        run: echo "owner=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # VITE_API_ORIGIN/VITE_API_KEY are baked into the JS bundle at build time (Vite has no
      # runtime env mechanism) so the dashboard on Render can call the API's public URL
      # directly instead of through nginx — see web/src/api/client.ts for why. The API URL
      # itself isn't a secret (it's the public sabemi-api hostname); DASHBOARD_API_KEY is
      # only gate-level, not a real credential boundary, same reasoning as it already being
      # injected server-side by nginx for the proxied (local/docker-compose) case. It's a
      # different value from the partner bank's Webhook__ApiKey on purpose — this one ends
      # up in a public JS bundle, that one never should.
      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: ./web
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.image-name.outputs.owner }}-web:latest
          build-args: |
            VITE_API_ORIGIN=https://sabemi-api.onrender.com
            VITE_API_KEY=${{ secrets.DASHBOARD_API_KEY }}

      # Render redeploys by re-pulling the `:latest` tag from the registry whenever its
      # Deploy Hook URL receives a POST.
      - name: Trigger Render deploy — web
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_WEB }}"
