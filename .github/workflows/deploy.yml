name: Build, test and deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Integration tests spin up a real Postgres via Testcontainers — Docker is
      # already available on ubuntu-latest runners, no extra setup needed.
      - name: Run backend test suite
        run: dotnet test --configuration Release

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-owner: ${{ steps.image-names.outputs.owner }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR requires lowercase image paths; the repo owner/name can contain uppercase.
      - name: Compute lowercase image names
        id: image-names
        run: echo "owner=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/SabemiTec.Api/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.image-names.outputs.owner }}-api:latest

      # VITE_API_ORIGIN/VITE_API_KEY are baked into the JS bundle at build time (Vite has no
      # runtime env mechanism) so the dashboard on Render can call the API's public URL
      # directly instead of through nginx — see web/src/api/client.ts for why. The API URL
      # itself isn't a secret (it's the public sabemi-api hostname); WEBHOOK_API_KEY is
      # only gate-level, not a real credential boundary, same reasoning as it already being
      # injected server-side by nginx for the proxied (local/docker-compose) case.
      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: ./web
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.image-names.outputs.owner }}-web:latest
          build-args: |
            VITE_API_ORIGIN=https://sabemi-api.onrender.com
            VITE_API_KEY=${{ secrets.WEBHOOK_API_KEY }}

  deploy:
    needs: build-and-push
    # Manual gate: push to main only tests and publishes fresh images (:latest sits ready
    # in GHCR) — it never redeploys Render on its own. Deploy by running this workflow by
    # hand (Actions tab → "Build, test and deploy" → Run workflow), after checking the
    # pushed images are what you want live.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      # Render redeploys by re-pulling the `:latest` tag from the registry whenever its
      # Deploy Hook URL receives a POST. Configure these two repo secrets once the Render
      # services exist — see README.md "Deploy" section.
      - name: Trigger Render deploy — API
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_API }}"

      - name: Trigger Render deploy — web
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_WEB }}"
