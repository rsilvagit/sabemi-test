name: Build, test and deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Integration tests spin up a real Postgres via Testcontainers — Docker is
      # already available on ubuntu-latest runners, no extra setup needed.
      - name: Run backend test suite
        run: dotnet test --configuration Release

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-owner: ${{ steps.image-names.outputs.owner }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR requires lowercase image paths; the repo owner/name can contain uppercase.
      - name: Compute lowercase image names
        id: image-names
        run: echo "owner=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/SabemiTec.Api/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.image-names.outputs.owner }}-api:latest

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: ./web
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.image-names.outputs.owner }}-web:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      # Render redeploys by re-pulling the `:latest` tag from the registry whenever its
      # Deploy Hook URL receives a POST. Configure these two repo secrets once the Render
      # services exist — see README.md "Deploy" section.
      - name: Trigger Render deploy — API
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_API }}"

      - name: Trigger Render deploy — web
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_WEB }}"
