name: Deploy Load Simulator

# Manual only: builds and pushes a fresh :latest load-simulator image, then tells
# Render to redeploy it. Independent from the API and web pipelines — running this
# never touches their images or their Render services.
on:
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR requires lowercase image paths; the repo owner/name can contain uppercase.
      - name: Compute lowercase image name
        id: image-name
        run: echo "owner=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push load-simulator image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/SabemiTec.LoadSimulator/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.image-name.outputs.owner }}-load-simulator:latest

      # Render redeploys by re-pulling the `:latest` tag from the registry whenever its
      # Deploy Hook URL receives a POST. Configure this Render Background Worker service
      # (no public port) with API_URL and WEBHOOK_API_KEY env vars first.
      - name: Trigger Render deploy — load simulator
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_LOAD_SIMULATOR }}"
